<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>404
    </title>
    <meta name="description" content="">
    <link rel="icon" type="image/png" sizes="512x512" href="img/favicon.png">
    <link rel="shortcut icon" href="img/favicon.ico">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta property="og:title" content="404">
    <meta property="og:description" content="">
    <meta property="og:type" content="website">
    <meta property="og:image" content="img/hero-poster.jpg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
:root{--t:#1F5F7C;--a:#2898C4;--s:#7BC2DE;--ink:#14212b;--mute:#5b6a75;--line:#dde4e9;--alt:#f3f8fb}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:"Pretendard","Noto Sans KR",-apple-system,system-ui,sans-serif;line-height:1.75;background:#fff}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}h1,h2,h3{margin:0;color:var(--t);line-height:1.2}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header{position:absolute;left:0;right:0;top:0;z-index:20}header.solid{position:sticky;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar{display:flex;align-items:center;justify-content:space-between;height:70px}.bar img{height:34px}
nav a{font-weight:600;margin-left:24px;font-size:15px}nav a.on{border-bottom:2px solid var(--a);padding-bottom:3px}
.lang{font-size:12px;font-weight:700;border:1px solid currentColor;padding:3px 10px;border-radius:14px;margin-left:20px}
.burger{display:none;background:none;border:0;font-size:24px;color:inherit;cursor:pointer;margin-left:12px}
.dark nav a,.dark .lang,.dark .burger{color:#fff}.solid nav a,.solid .lang,.solid .burger{color:var(--t)}
.mnav{display:none;background:#fff;border-bottom:1px solid var(--line)}.mnav a{display:block;padding:14px 24px;border-top:1px solid var(--line);font-weight:600;color:var(--t)}
.hero{position:relative;min-height:760px;display:flex;align-items:center;color:#fff;overflow:hidden;background:#0f2733 url(img/hero-poster.jpg) center/cover}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,36,52,.85),rgba(9,36,52,.45) 60%,rgba(9,36,52,.15));z-index:1}
.hero .wrap{position:relative;z-index:2}.kicker{color:var(--s);letter-spacing:.14em;font-weight:700;font-size:13px;margin-bottom:14px}
.hero h1{font-size:50px;color:#fff;font-weight:800;margin-bottom:18px}.hero p{font-size:18px;max-width:640px;color:#e6f1f7;margin:0 0 26px}
.btn{display:inline-block;padding:13px 24px;border-radius:6px;font-weight:700;background:var(--a);color:#fff;margin:0 10px 10px 0}.btn.g{background:transparent;border:2px solid #fff}
.stats{background:var(--t);color:#fff}.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr)}.stats div{padding:24px 16px;border-left:1px solid rgba(255,255,255,.18)}.stats b{display:block;font-size:32px;font-weight:800}.stats span{font-size:13px;color:#cfe6f2}
section{padding:80px 0}.alt{background:var(--alt)}h2{font-size:30px;margin-bottom:26px}.sub{color:var(--mute);margin:-14px 0 30px;line-height:1.8}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}.two img{border-radius:10px;box-shadow:0 12px 30px rgba(31,95,124,.18)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.card img{aspect-ratio:4/3;object-fit:cover;width:100%}.card div{padding:16px 18px}.card b{color:var(--t);font-size:18px;display:block;margin-bottom:4px}.card small{color:var(--mute);line-height:1.6;display:block}
.tile{position:relative;height:260px;border-radius:10px;background:center/cover;display:flex;align-items:flex-end;color:#fff;font-weight:700;font-size:18px;overflow:hidden}.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(9,36,52,.9))}.tile span{position:relative;padding:18px}
.ref{border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);cursor:pointer}.ref img{aspect-ratio:4/3;object-fit:cover;width:100%}.ref div{padding:10px 12px;font-size:13px}.ref b{display:block;color:var(--t)}
.sup div{background:#fff;border-top:4px solid var(--a);padding:22px;box-shadow:0 4px 14px rgba(31,95,124,.08);line-height:1.75}.sup b{display:block;color:var(--t);font-size:16px;margin-bottom:10px}.sup em{font-style:normal;color:var(--a);font-weight:800;margin-right:6px}
.cta{background:linear-gradient(120deg,var(--t),var(--a));color:#fff;text-align:center}.cta h2{color:#fff}.mail{display:inline-block;font-size:28px;font-weight:800;color:#fff;border-bottom:2px solid rgba(255,255,255,.6);cursor:pointer;margin:6px 0 10px}.hint{font-size:13px;color:#cfe6f2}
footer{background:#0f2733;color:#b9cbd6;padding:36px 0;font-size:13px;line-height:1.8}footer img{height:30px;margin-bottom:12px}footer b{color:#fff}
.wmap,.imap{width:100%;height:auto;background:var(--alt);border-radius:12px}.wmap .ld,.imap .ld{fill:#d6e6ef;stroke:#fff;stroke-width:.4}.wmap .hi,.imap .hi{fill:#9fd0e6;stroke:#fff;stroke-width:.4}.halo{fill:var(--a);opacity:.22}.dot{fill:var(--a)}.fac{fill:var(--t)}.wmap text{font-size:11px;font-weight:700;fill:var(--t);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}.imap text{font-size:12px;fill:var(--t);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}.imap text.b{font-weight:700}
.ph{position:relative;min-height:340px;display:flex;align-items:flex-end;color:#fff;background:center/cover}.ph:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,36,52,.35),rgba(9,36,52,.8))}.ph .wrap{position:relative;padding-bottom:40px}.ph h1{color:#fff;font-size:42px}.ph p{color:#dcecf5;margin:8px 0 0}
.prose p{margin:0 0 10px;font-size:16px;line-height:1.85}.prose p.gap{margin-top:26px}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;line-height:1.6}th{background:var(--t);color:#fff;font-weight:600}tr:nth-child(even) td{background:#fafbfc}
.tbl{overflow-x:auto;margin:10px 0 6px}table.ov{table-layout:fixed;min-width:720px}table.ov td{word-break:keep-all}.note{font-size:12.5px;color:var(--mute);margin:4px 0 0}
.prod{display:grid;grid-template-columns:1fr 1.4fr;gap:48px;align-items:start;padding:56px 0;border-top:1px solid var(--line)}.prod img{border-radius:10px}.prod h2{margin-bottom:10px}.prod ul{margin:14px 0 22px;padding-left:18px;line-height:1.9}.prod ul li{margin-bottom:4px}.prod h3{font-size:16px;margin:22px 0 8px}
.timeline{list-style:none;padding:0;margin:0}.timeline li{display:grid;grid-template-columns:90px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.timeline b{color:var(--a)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.steps div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;line-height:1.8}.steps em{font-style:normal;color:var(--a);font-weight:800;font-size:22px;display:block}.steps b{display:block;color:var(--t);font-size:17px;margin:8px 0 10px}
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:24px 0 0}.flow span{background:var(--t);color:#fff;padding:10px 16px;border-radius:6px;font-weight:600}.flow i{color:var(--a);font-style:normal;font-weight:800}
.res div{background:#fff;border-left:4px solid var(--a);padding:18px 20px;margin-bottom:14px;line-height:1.8}.res b{display:block;color:var(--t);margin-bottom:6px}.res span{font-size:15px}
.tabs button{background:#fff;border:1px solid var(--line);padding:8px 16px;border-radius:20px;margin:0 6px 16px 0;cursor:pointer;font-weight:600;color:var(--t);font-family:inherit}.tabs button.on{background:var(--a);color:#fff;border-color:var(--a)}
.locs div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;line-height:1.8}.locs b{display:block;color:var(--t);margin-bottom:8px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.lb img{max-height:85vh;max-width:95vw;border-radius:6px}.lb span{position:absolute;bottom:24px;color:#fff;font-size:14px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}.toast.on{opacity:1}
.hide{display:none}
@media(max-width:900px){.stats .wrap{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}.two,.prod{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}
@media(max-width:768px){nav.desk{display:none}.burger{display:inline-block}.hero{min-height:560px;padding:100px 0 50px}.hero video{display:none}.hero h1{font-size:30px}.hero p{font-size:15px}h2{font-size:24px}.wrap{padding:0 16px}.stats div{border-left:0;border-top:1px solid rgba(255,255,255,.18)}.ph h1{font-size:30px}.mail{font-size:20px;word-break:break-all}.tile{height:200px}table{font-size:12px}}
@media(max-width:480px){.g4{grid-template-columns:1fr}.stats .wrap{grid-template-columns:1fr 1fr}}
</style>
  </head>
  <body>
    <section style="padding:160px 0;text-align:center">
      <div class="wrap">
        <h1>404
        </h1>
        <p style="margin:16px 0 28px">Page not found.
        </p><a class="btn" href="/">Home</a>
      </div>
    </section>
  </body>
</html>
